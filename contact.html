
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="拾光義麵聯絡表單">
  <title>拾光義麵｜聯絡我們</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* 僅作用於聯絡我們頁面 */

    .contact-card {
      width: calc(100% - 32px);
      max-width: 680px;
      margin: 30px auto 70px;
      padding: 36px;
      box-sizing: border-box;
      background: #fffdfa;
      border: 1px solid #e7dbcd;
      border-radius: 18px;
    }

    /* 四個欄位全部直式排列 */
    #contact-form .form-grid {
      display: flex !important;
      flex-direction: column !important;
      gap: 20px !important;
    }

    #contact-form .field,
    #contact-form .field.full {
      display: block !important;
      width: 100% !important;
      min-width: 0;
      box-sizing: border-box;
    }

    #contact-form label {
      display: block;
      margin-bottom: 8px;
      color: #594536;
      font-weight: 600;
    }

    #contact-form input,
    #contact-form textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border: 1px solid #dccabd;
      border-radius: 9px;
      background: #fff;
      font-size: 16px;
    }

    #contact-form textarea {
      min-height: 140px;
      resize: vertical;
    }

    #contact-form .submit-button {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 25px auto;
      padding: 15px;
      background: #725640;
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .contact-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      拾光義麵 <span>SHIGUANG PASTA</span>
    </a>
    <nav aria-label="主選單">
      <a href="index.html">首頁</a>
      <a href="about.html">公司介紹</a>
      <a class="active" aria-current="page"
         href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">GET IN TOUCH</p>
      <h1>聯絡我們</h1>
      <p>有任何想法、建議或合作邀約，都歡迎留下訊息。</p>
    </section>

    <section class="contact-card">
      <h2>寫封訊息給拾光義麵</h2>
      <p>請填寫以下資料，讓我們了解您的需求。</p>

      <form id="contact-form"
        action="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"
        method="POST"
        target="_blank"
        accept-charset="UTF-8">

        <div class="form-grid">

          <div class="field">
            <label for="name">姓名 *</label>
            <input id="name" name="name"
              type="text" required
              maxlength="80"
              placeholder="請輸入您的姓名">
          </div>

          <div class="field">
            <label for="phone">聯絡電話 *</label>
            <input id="phone" name="phone"
              type="tel" required
              maxlength="40"
              placeholder="請輸入聯絡電話">
          </div>

          <div class="field">
            <label for="email">Email *</label>
            <input id="email" name="email"
              type="email" required
              maxlength="160"
              placeholder="example@gmail.com">
          </div>

          <div class="field">
            <label for="message">聯絡內容 *</label>
            <textarea id="message" name="message"
              required maxlength="3000"
              placeholder="請輸入您想詢問的內容"></textarea>
          </div>

        </div>

        <p class="note">
          * 為必填欄位。資料僅用於回覆此次聯絡需求。
        </p>

        <button class="button submit-button" type="submit">
          送出聯絡表單 →
        </button>

        <p class="note" id="form-hint" role="status">
          送出後請查看確認頁面，並確認收件信箱是否收到通知。
        </p>
      </form>
    </section>
  </main>

  <footer>
    © 2026 拾光義麵 Shiguang Pasta · 課程作品示範網站
  </footer>

  <script>
    document.getElementById('contact-form')
      .addEventListener('submit', function(event) {
        if (this.action.includes('YOUR_DEPLOYMENT_ID')) {
          event.preventDefault();
          document.getElementById('form-hint').textContent =
            '尚未設定寄信功能，請先完成 Apps Script 部署。';
        }
      });
  </script>
</body>
</html>
